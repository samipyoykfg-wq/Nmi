name: SSH VPS Session

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Update & Install SSH
        run: |
          sudo apt update -y
          sudo apt install -y openssh-server curl tar

      - name: Configure SSH (VPS-like)
        run: |
          sudo mkdir -p /run/sshd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          echo "root:Root@2026" | sudo chpasswd
          sudo service ssh restart

      - name: Install bore
        run: |
          curl -L https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o bore.tar.gz
          tar xzf bore.tar.gz
          sudo mv bore /usr/local/bin/
          chmod +x /usr/local/bin/bore

      - name: Get Public IP
        run: |
          echo "🌐 Public IP:"
          curl -4 -s https://api.ipify.org
          echo ""

      - name: Start bore Tunnel
        run: |
          echo "=========================================="
          echo "🚀 SSH VPS READY"
          echo "=========================================="
          echo "👤 User: root"
          echo "🔐 Password: Root@2026"
          echo "🌐 Host: bore.pub"
          echo "🔌 Port: سيظهر أدناه"
          echo "=========================================="
          bore local 22 --to bore.pub > /tmp/bore.log 2>&1 &
          sleep 10
          echo ""
          echo "📡 bore tunnel:"
          cat /tmp/bore.log
          echo ""
          sleep 21600
